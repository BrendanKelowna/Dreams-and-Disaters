<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreams and Disasters - Settings</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <script src="scriptSettings.js" defer></script>
</head>

<body>
    <div id="nav"></div>
    <main class="app">
        <h1>Dreams and Disasters - Settings</h1>
        <section class="panel">
            <div class="description" id="helpDescription" hidden>
                <div class="help-header">
                    <p><small>Changes are saved to cache. Cache can be cleared so export your data to backup when done
                            setting up.</small></p>
                    <button id="closeHelpBtn" type="button" class="secondary">Close</button>
                </div>
            </div>

            <div class="button-container">
                <button id="addNameBtn" type="button">Save</button>
                <button id="loadNamesBtn" type="button" class="secondary">Refresh</button>
                <div class="export-tooltip-wrap">
                    <button id="exportBtn" type="button" class="secondary">Export</button>
                    <div class="export-tooltip">
                        <small>Changes are saved to cache. Cache can be cleared so export your data to backup when done
                            setting up.</small>
                    </div>
                </div>
                <button id="importBtn" type="button" class="secondary">Import</button>
                <input id="importInput" type="file" accept=".csv,text/csv" hidden />
                <button id="defaults" type="button" value="Reset to defaults" class="secondary">Reset to
                    defaults</button>
            </div>
        </section>
        <section class="panel">
            <h2>General</h2>
            <div class="input-container item sb row">
                <label for="roll-irl">Roll in real life</label>
                <input id="roll-irl" type="checkbox" />
            </div>
            <div class="input-container item sb row">
                <label for="events-amount">Events per round</label>
                <input id="events-amount" type="number" />
            </div>

        </section>

        <section class="panel">
            <h2>Players</h2>
            <div class="input-container">
                <label for="nameInput">Name</label>
                <input id="nameInput" type="text" placeholder="Enter a name" />
            </div>
            <ul id="nameList" class="name-list settings-list"></ul>
        </section>
        <section class="panel">
            <h2>Rules</h2>
            <div class="input-container">
                <label for="rulesInput">Rule</label>
                <input id="rulesInput" type="text" placeholder="Enter rules" />
            </div>
            <ul id="rulesList" class="rules-list settings-list"></ul>
        </section>
        <section class="panel">
            <h2> Events</h2>
            <div class="input-container">
                <label for="eventsInput">Events</label>
                <input id="eventsInput" type="text" placeholder="Enter events" />
            </div>
            <ul id="eventsList" class="events-list settings-list"></ul>
        </section>
    </main>
</body>

</html>
