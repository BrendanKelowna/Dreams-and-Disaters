<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreams and Disasters</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <script src="scriptHome.js" defer></script>
</head>

<body>
  <div id="nav"></div>
  <main class="app">
    <div class="header row sb ac pv2">
      <h1 class="m0">Dreams and Disasters</h1><button id="dl-sheet" class="secondary">Download player sheet</button>
    </div>
    <section class="panel">
      <div>
        <h2>Play</h2>
      </div>
      <div class="play-container">
        <div class="item g1 stack">
          <h3> Players choosen</h3>
          <button id="playerRoll" type="button" value="Roll">Roll</button>
        </div>
        <div class="item g1 stack">
          <h3>Events</h3>
          <button id="eventRoll" type="button" value="Roll">Roll</button>
        </div>
        <div class="item g1 stack">
          <h3>Roll</h3>
          <button id="diceRoll" type="button" value="Roll">Roll</button>
        </div>
      </div>
      <h2> History</h2>
    </section>
    <section class="panel">
      <h2>Players</h2>
      <ul id="nameList" class="name-list"></ul>
    </section>
    <section class="panel">
      <h2>Rules</h2>
      <ul id="rulesList" class="rules-list"></ul>
  </main>
</body>

</html>
